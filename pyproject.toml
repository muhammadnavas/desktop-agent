[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-agent"
version = "0.2.0"
description = "Local-first Windows desktop assistant with Ollama and offline voice input"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# faster-whisper 1.2.1 calls av.open(metadata_errors=...), removed in PyAV 19.
# Keep PyAV below 19 until the released faster-whisper package supports it.
voice = ["faster-whisper>=1.1,<2.0", "av>=11,<19"]
desktop = ["pyautogui>=0.9.54,<1.0"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["desktop_agent*"]
